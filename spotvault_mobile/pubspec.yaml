name: spotvault_mobile
description: Sovereign offline audio synchronization engine for Android & iOS.
publish_to: 'none'
version: 2.0.0+9

environment:
  sdk: ^3.5.0

dependencies:
  app_links: ^7.2.2
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.2
  qr_flutter: ^4.1.0
  serious_python: ^6.1.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.31.1

flutter:
  uses-material-design: true
# sqflite_android 2.4.5 calls Thread.threadId() (Java 19+), which fails to
# compile against the Java 17 target. Pulled in by audio_service's art cache.
dependency_overrides:
  sqflite_android: 2.4.1
