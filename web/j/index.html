<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join a Jam · SpotVault</title>
  <meta name="description" content="Open this link with SpotVault to join a friend's Jam.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/logo.png">
  <style>
    :root { --bg: #ECEAE6; --surface: #fff; --text: #111; --muted: #66635E; --line: rgba(0,0,0,.09); --ink: #111; --ink-text: #F2EFE8; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0E0E0F; --surface: #1C1C1E; --text: #F2EFE8; --muted: #A09C96; --line: rgba(255,255,255,.1); --ink: #F2EFE8; --ink-text: #111; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 28px; padding: 30px 26px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.12); }
    .logo { width: 64px; height: 64px; margin: 0 auto 18px; }
    h1 { font-size: 26px; letter-spacing: -.03em; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 22px; line-height: 1.5; }
    .btn { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; font-weight: 600; text-decoration: none; margin-top: 10px; }
    .primary { background: var(--ink); color: var(--ink-text); }
    .ghost { border: 1px solid var(--line); color: var(--text); }
    small { display: block; color: var(--muted); margin-top: 18px; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="26" fill="#111"/><path d="M65 35 C64 28 58 25 50 25 C40 25 34 30 34 37.5 C34 45.5 42 47.5 50 50 C58 52.5 66 54.5 66 62.5 C66 70 60 75 50 75 C42 75 36 72 35 65" fill="none" stroke="#ECEAE6" stroke-width="9" stroke-linecap="round"/><path d="M61.5 50 L42 61.26 L42 38.74 Z" fill="#111"/><path d="M56.7 50 L44.4 57.1 L44.4 42.9 Z" fill="#E0403B"/></svg>
    <h1 id="title">Join the Jam</h1>
    <p id="text">Open this with SpotVault on your phone. You need to be on the same Wi-Fi as your friend.</p>
    <a class="btn primary" id="open" href="#">Open in SpotVault</a>
    <a class="btn ghost" href="/spotvault/#download">Don't have SpotVault? Get it free</a>
    <small id="hint"></small>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var kind = location.pathname.indexOf('/pc') === 0 ? 'pc' : 'j';
      var ip = /^\d{1,3}(\.\d{1,3}){3}$/;
      var h = q.get('h') || '', p = q.get('p') || '';
      var code = (q.get('c') || '').toUpperCase();
      var net = kind === 'j' && /^[A-Z0-9]{6}$/.test(code); // Jam over the internet
      var ok = net || (ip.test(h) && /^\d{2,5}$/.test(p));
      var title = document.getElementById('title'), text = document.getElementById('text'), open = document.getElementById('open');
      if (kind === 'pc') {
        title.textContent = 'Link your phone to your PC';
        text.textContent = 'Open this with SpotVault on your phone, on the same Wi-Fi as your PC.';
      } else if (q.get('n')) {
        title.textContent = 'Join ' + q.get('n').slice(0, 40) + "'s Jam";
      }
      if (net) text.textContent = 'Open this with SpotVault on your phone. Works from anywhere: your friend lets you in.';
      document.title = title.textContent + ' · SpotVault';
      if (!ok) {
        open.style.display = 'none';
        document.getElementById('hint').textContent = 'This link looks incomplete. Ask for a new one, or scan the code in the app.';
        return;
      }
      var params = net ? new URLSearchParams({ c: code }) : new URLSearchParams({ h: h, p: p });
      if (kind === 'j' && q.get('n')) params.set('n', q.get('n').slice(0, 40));
      if (kind === 'pc' && /^\d{6}$/.test(q.get('k') || '')) params.set('k', q.get('k'));
      var app = 'spotvault://' + kind + '?' + params.toString();
      open.href = app;
      // Phones with SpotVault open it straight away.
      if (/Android|iPhone|iPad/i.test(navigator.userAgent)) setTimeout(function () { location.href = app; }, 300);
      document.getElementById('hint').textContent = 'Nothing happened? Make sure SpotVault 2.0 or newer is installed.';
    })();
  </script>
</body>
</html>
