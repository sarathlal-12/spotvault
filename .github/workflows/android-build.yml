# Builds the SpotVault Mobile release APK on GitHub (no Android Studio needed
# on your PC).
#
# Run it: GitHub > Actions > "Build Android APK" > Run workflow.
# Pushing a tag like v1.2.0 also builds it and attaches the APK to that release.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release tag (optional, e.g. v1.1.0)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SERIOUS_PYTHON_VERSION: "3.13"
  SERIOUS_PYTHON_BUNDLE_ID: com.spotvault.app.spotvaultMobile

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spotvault_mobile
    env:
      SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/spotvault_mobile/build/site-packages
      SERIOUS_PYTHON_APP: ${{ github.workspace }}/spotvault_mobile/build/python-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The on-phone downloader: Python + yt-dlp + the PC's clean-music filter.
      - name: Package the phone downloader (Python)
        run: |
          cp ../src/sources.py python/
          dart run serious_python:main package python -p Android -r -r -r python/requirements.txt --cleanup-packages

      - name: Run tests
        run: flutter test

      # The same key must sign every release, or phones refuse the update.
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (see UPDATES.md).
      - name: Set up release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Add them as described in UPDATES.md."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/spotvault-release.jks
          {
            echo "storeFile=spotvault-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "storeType=pkcs12"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "SpotVault_v${VERSION}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpotVault-Android
          path: spotvault_mobile/*.apk
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" *.apk --clobber --repo "$GITHUB_REPOSITORY"
