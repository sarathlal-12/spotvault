# Builds the SpotVault Mobile release APK on GitHub (no Android Studio needed
# on your PC).
#
# Run it: GitHub > Actions > "Build Android APK" > Run workflow.
# Pushing a tag like v1.2.0 also builds it and attaches the APK to that release.
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release tag (optional, e.g. v1.1.0)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: spotvault_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "SpotVault_v${VERSION}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpotVault-Android
          path: spotvault_mobile/*.apk
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" *.apk --clobber --repo "$GITHUB_REPOSITORY"
